name = "gregskril"
main = "worker/index.ts"
compatibility_date = "2026-10-30"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/blah/*"]

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01
